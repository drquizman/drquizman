<!doctype html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140c1c"><title>Паки вопросов — Dr. Quizman</title>
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="styles.css?v=3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="catalog.js" defer></script><script src="app.js?v=3" defer></script>
</head><body>
<header class="topbar wrap"><img src="assets/logo.png" alt="Dr. Quizman" class="logo"><span id="account" class="preview-label">Подключение…</span></header>
<main class="wrap"><div class="heading"><div><h1>Паки вопросов</h1><p id="summary">Каталог Dr. Quizman</p></div><button id="reset" disabled>Сбросить фильтры</button></div>
<div id="notice" role="status"><p id="notice-text">Загружаем каталог…</p><a id="open-bot" href="https://t.me/DrQuizman_bot" hidden>Открыть бота</a><button id="retry" hidden>Повторить</button></div>
<section id="catalog" hidden>
<p class="catalog-help">Бесплатные и пакеты из вашей коллекции можно скачать в игре: «Выбрать вопросы» → «Загрузить все».</p>
<p id="purchase-feedback" role="status"></p><div class="table-frame"><table aria-label="Каталог паков вопросов">
<colgroup><col class="col-language"><col class="col-topic"><col class="col-count"><col class="col-status"><col class="col-price"></colgroup>
<thead><tr>
<th scope="col"><label for="language">Язык</label><select id="language" aria-label="Фильтр по языку"><option value="all">Все</option><option value="ru">Русский</option><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="he">עברית</option></select></th>
<th scope="col"><label for="topic">Темы пака</label><select id="topic" aria-label="Фильтр по теме"><option value="all">Все</option></select></th>
<th scope="col"><label for="count"><span class="desktop-label">Вопросов</span><span class="mobile-label">Кол-во</span></label><select id="count" aria-label="Фильтр по количеству вопросов"><option value="all">Все</option></select></th>
<th scope="col"><label for="status">Доступ</label><select id="status" aria-label="Фильтр по доступу"><option value="all">Все</option><option value="free">Бесплатные</option><option value="owned">В коллекции</option><option value="paid">К покупке</option></select></th>
<th scope="col"><label for="price">Цена</label><select id="price" aria-label="Фильтр по цене"><option value="all">Все</option><option value="0">0 ★</option><option value="owned">Есть</option><option value="soon">Позже</option></select></th>
</tr></thead><tbody id="pack-rows"></tbody></table>
<div id="empty" hidden><p>Нет паков с такими параметрами</p><button id="empty-reset">Сбросить фильтры</button></div></div>
<footer><span id="result-count" role="status"></span><span>Тестовые покупки · без списания звёзд</span></footer>
</section></main></body></html>
